name: Diagnose gc9307 build

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Setup environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
            genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
            libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 1024
          remove-dotnet: 'false'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare
        run: ./prepare.sh

      - name: Restore cache
        uses: actions/cache/restore@v3
        with:
          path: |
            lede/dl
            lede/staging_dir
          key: ${{ runner.os }}-openwrt-master-${{ hashFiles('xgp.config', 'patches/*.patch', 'overlays/**') }}

      - name: Install feeds
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -a -f -p qmodem
          cp ../xgp.config .config
          make defconfig
          # 缓存里 toolchain 不完整（缺 ld-musl），强制重装，保证内核模块能编译
          rm -rf staging_dir/toolchain-* build_dir/target-*/toolchain
          make -j$(nproc) toolchain/install

      - name: Compile gc9307 with verbose output
        id: compile
        run: |
          cd lede
          set +e
          make -j$(nproc) V=s package/zz/kmod-fb-tft-gc9307/compile > gc9307.log 2>&1
          RC=$?
          echo "exit code: $RC"
          echo "=== LAST 150 LINES ==="
          tail -150 gc9307.log
          exit $RC

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc9307-diag-log
          path: lede/gc9307.log

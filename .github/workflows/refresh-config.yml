name: Refresh config (master)

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        run: sudo ./install-env.sh

      - name: Prepare LEDE master tree
        run: ./prepare.sh

      - name: Install feeds
        run: |
          cd lede
          ./scripts/feeds update -a || { echo "feeds update failed"; exit 1; }
          ./scripts/feeds install -a || { echo "feeds install failed"; exit 1; }
          ./scripts/feeds install -a -f -p qmodem || { echo "qmodem feeds install failed"; exit 1; }

      - name: Run defconfig and normalize
        run: |
          cd lede
          cp ../xgp.config .config
          make defconfig || { echo "defconfig failed"; exit 1; }
          cp .config ../xgp.config.normalized
          echo "=== normalized config lines: $(wc -l < ../xgp.config.normalized) ==="
          grep -nE 'CONFIG_USE_APK|CONFIG_PACKAGE_opkg|CONFIG_PACKAGE_apk-mbedtls|CONFIG_DEFAULT_opkg|luci-app-package-manager|luci-app-opkg' ../xgp.config.normalized | head -20

      - name: Upload normalized config
        uses: actions/upload-artifact@v4
        with:
          name: xgp-config-normalized
          path: xgp.config.normalized
